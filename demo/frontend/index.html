<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>前后端协作演示</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; }
        .result { background: #f5f5f5; padding: 10px; border-radius: 4px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>🌐 前后端分离演示</h1>
    <p>前端页面由浏览器打开（file:// 或 http://），后端服务运行在 <code>http://localhost:3002</code></p>
    
    <button id="getBtn">🔹 GET /api/hello</button>
    <button id="postBtn">🔸 POST /api/greet</button>
    
    <div id="output" class="result">等待操作…</div>

    <script>
        const output = document.getElementById('output');
        const API_BASE = 'http://localhost:3002/api';

        document.getElementById('getBtn').onclick = async () => {
            try {
                const res = await fetch(`${API_BASE}/hello`);
                const data = await res.json();
                output.innerHTML = `GET 响应：${data.message}`;
            } catch (err) {
                output.innerHTML = `错误：${err.message}。请确保后端已启动 (npm start)`;
            }
        };

        document.getElementById('postBtn').onclick = async () => {
            const name = prompt("请输入你的名字", "学生");
            try {
                const res = await fetch(`${API_BASE}/greet`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name })
                });
                const data = await res.json();
                output.innerHTML = `POST 响应：${data.message}`;
            } catch (err) {
                output.innerHTML = `错误：${err.message}`;
            }
        };
    </script>
</body>
</html>
